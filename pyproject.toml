[project]
name = "locoagente"
version = "0.1.0"
description = "Conversational harness for small local models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Michael Borck", email = "michael@borck.id.au" },
]
keywords = ["agentic", "harness", "small-language-models", "local-ai", "consumer-hardware"]
dependencies = [
    "openai>=1.0",
    "PyYAML>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
]

[project.scripts]
locoagente = "cli.locoagente:main"

[tool.setuptools.packages.find]
include = ["harness*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
